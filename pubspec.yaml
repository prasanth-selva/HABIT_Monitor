name: streakly
description: A premium habit tracker app
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  go_router: ^13.0.0

  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  fl_chart: ^0.66.2
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  modal_bottom_sheet: ^3.0.0

  google_fonts: ^6.1.0

  intl: ^0.19.0
  uuid: ^4.3.3
  collection: ^1.18.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
